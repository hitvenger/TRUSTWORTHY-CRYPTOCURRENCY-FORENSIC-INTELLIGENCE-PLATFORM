version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: tcf-fx-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./tcf_forensics.db
      - SECRET_KEY=tcf_fx_super_secret_forensic_key_2026_salt_9981
      - ETH_RPC_URL=""
    volumes:
      - ./reports:/app/reports
      - ./datasets:/app/datasets
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: tcf-fx-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
